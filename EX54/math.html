<html>
    <head>
        <title>Tiều đề trang</title>
        <script>
            function MAX(){
                a=parseFloat(myform.a.value)
                b=parseFloat(myform.b.value)
                c=parseFloat(myform.c.value)
                max=a
                if(max<b){
                    max=b
                }
                if(max<c){
                    max=c
                }
                mydiv.innerHTML="MAX = " + max
            }
            function MIN(){
                a=parseFloat(myform.a.value)
                b=parseFloat(myform.b.value)
                c=parseFloat(myform.c.value)
                min=a
                if(min>b){
                    min=b
                }
                if(min>c){
                    min=c
                }
                mydiv.innerHTML="MIN = " + min
            }
            function sin(){
                a=parseFloat(myform.a.value)
                result=Math.sin(a)
                mydiv.innerHTML="Sin(a) = " + result
            }
             function cos(){
                a=parseFloat(myform.a.value)
                result=Math.cos(a)
                mydiv.innerHTML="Cos(a) = " + result
            }
             function amub(){
                a=parseFloat(myform.a.value)
                b=parseFloat(myform.b.value)
                result=Math.pow(a,b)
                mydiv.innerHTML="a^b = " + result
            }
        </script>
    </head>
    <body>
        <form name="myform">
         <table border="1">
            <tr>
                <td>a</td>
                <td><input type="text" name="a"></td>
            </tr>
            <tr>
                <td>b</td>
                <td><input type="text" name="b"></td>
            </tr>
            <tr>
                <td>c</td>
                <td><input type="text" name="c"></td>
            </tr>
            <tr>
                <td>Result:</td>
                <td><div id="mydiv"></div></td>
            </tr>
        </table>
        <button type="button" onclick="MAX()">MAX</button>
        <button type="button" onclick="MIN()">MIN</button>
        <button type="button" onclick="sin()">Sin(a)</button>
        <button type="button" onclick="cos()">Cos(a)</button>
        <button type="button" onclick="amub()">a^b</button>
        </form>
    </body>
</html>
